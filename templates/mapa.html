<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapas de Temuco — Inmobiliario 360</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>.gradient-header { background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%); }</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<header class="gradient-header text-white shadow-lg">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <i class="fas fa-building text-xl text-emerald-300"></i>
      <span class="font-bold">Temuco Inmobiliario 360</span>
    </div>
    <nav class="flex gap-4 text-sm">
      <a href="/" class="text-blue-200 hover:text-white"><i class="fas fa-home mr-1"></i>Inicio</a>
      <a href="/historial" class="text-blue-200 hover:text-white"><i class="fas fa-history mr-1"></i>Historial</a>
    </nav>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-6 flex-1">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-2xl font-bold text-gray-800">
      <i class="fas fa-map-marked-alt mr-2 text-emerald-500"></i>Mapas de Calor — Temuco
    </h1>
    <div class="flex gap-2">
      {% for capa in capas %}
      <a href="/mapa/{{ capa }}" class="px-4 py-2 rounded-lg text-sm font-semibold transition
        {% if capa == capa_actual %}bg-blue-600 text-white{% else %}bg-white border border-gray-200 text-gray-700 hover:bg-gray-50{% endif %}">
        {% if capa == 'plusvalia' %}<i class="fas fa-trending-up mr-1"></i>Plusvalía
        {% elif capa == 'liquidez' %}<i class="fas fa-tachometer-alt mr-1"></i>Liquidez
        {% elif capa == 'inversion' %}<i class="fas fa-coins mr-1"></i>Inversión
        {% elif capa == 'captacion' %}<i class="fas fa-handshake mr-1"></i>Captación
        {% endif %}
      </a>
      {% endfor %}
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" style="height: calc(100vh - 220px)">
    {{ mapa_html | safe }}
  </div>
</div>
</body>
</html>
